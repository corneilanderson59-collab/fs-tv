<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #stage, #stage iframe, #stage video, #stage > div {
    position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000;
  }
  #stage video { object-fit: contain; }
  #stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .overlay {
    position: absolute; inset: 0; display: none; z-index: 5;
    flex-direction: column; align-items: center; justify-content: center; gap: 32px;
    background: radial-gradient(circle at 50% 38%, #12336E 0%, #061230 55%, #02060F 100%);
    color: #E8F1FF; font-family: 'Segoe UI', system-ui, sans-serif; text-align: center;
  }
  .overlay.show { display: flex; }
  .overlay h2 { margin: 0; font-size: 60px; font-weight: 600; letter-spacing: -0.5px; }
  .overlay p  { margin: 0; font-size: 30px; line-height: 1.4; color: #93AAD2; max-width: 72%; }
  .bar { width: 380px; height: 8px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; }
  .bar i { display: block; width: 38%; height: 100%; border-radius: 99px; background: #2F7BFF; animation: slide 1.15s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-110%); } to { transform: translateX(280%); } }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="loading" class="overlay"><h2>Tuning in</h2><div class="bar"><i></i></div></div>
  <div id="message" class="overlay"><h2 id="msgTitle"></h2><p id="msgText"></p></div>
  <script src="dui.js"></script>
</body>
</html>
